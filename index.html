<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR Camera Preview with Wide-Angle and Filters</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #vrContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background-color: black;
        }

        #videoContainer {
            width: 50vw;
            height: 100vh;
            background-color: gray;
            overflow: hidden;
        }

        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Keep the mirror effect (flip horizontally) */
            filter: invert(100%) grayscale(100%); /* Apply grayscale + invert filter */
        }
    </style>
</head>
<body>
    <!-- Add a container for the VR-like camera preview -->
    <div id="vrContainer">
        <div id="videoContainer">
            <video id="videoElement1" autoplay playsinline></video>
        </div>
        <div id="videoContainer">
            <video id="videoElement2" autoplay playsinline></video>
        </div>
    </div>

    <script>
        var constraints = {
            video: {
                facingMode: "environment", // Use the back camera
                width: { ideal: 3840 }, // Aim for a wide resolution
                height: { ideal: 2160 }, // Aim for a wide resolution
                frameRate: { ideal: 60 }, // Aim for 60 fps
                advanced: [
                    { width: { ideal: 3840 }, height: { ideal: 2160 } }, // Max out width and height
                    { facingMode: { exact: "environment" } }, // Ensure back camera is used
                    { zoom: { ideal: 0 } }, // Request the minimum zoom level (widest field of view)
                    { fieldOfView: { ideal: 120 } }, // Request the widest possible FOV (fisheye effect if available)
                ]
            },
            audio: false
        };

        var videoElements = [document.getElementById("videoElement1"), document.getElementById("videoElement2")];

        navigator.mediaDevices.getUserMedia(constraints)
        .then(function(stream) {
            videoElements.forEach(function(videoElement) {
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = function(e) {
                    videoElement.play();
                };
            });
        })
        .catch(function(error) {
            console.error("Camera access denied or error:", error);
        });
    </script>
</body>
</html>
