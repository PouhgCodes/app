<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR Camera Preview with Wide-Angle</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #vrContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background-color: black;
        }

        #videoContainer {
            width: 50vw;
            height: 100vh;
            background-color: gray;
            overflow: hidden;
        }

        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Keep the mirror effect (flip horizontally) */
            transform: scaleX(-1); 
            filter: invert(100%) grayscale(100%); /* Invert colors */
        }
    </style>
</head>
<body>
    <!-- Add a container for the VR-like camera preview -->
    <div id="vrContainer">
        <div id="videoContainer">
            <video id="videoElement1" autoplay playsinline></video>
        </div>
        <div id="videoContainer">
            <video id="videoElement2" autoplay playsinline></video>
        </div>
    </div>

    <script>
        var constraints = {
            video: {
                facingMode: "environment", // Back camera
                width: { ideal: 3840 }, // 4K resolution width (ideal)
                height: { ideal: 2160 }, // 4K resolution height (ideal)
                frameRate: { ideal: 60 }, // Aim for 60 fps for smoother video
                advanced: [
                    { noiseSuppression: false }, // Disable noise suppression (experimental)
                    { aspectRatio: 1.33 }, // Prefer wide-angle lens (if available, 4:3 aspect ratio)
                    { width: { min: 1920 }, height: { min: 1080 } } // Wide angle resolution constraint (minimum Full HD)
                ]
            },
            audio: false
        };

        var videoElements = [document.getElementById("videoElement1"), document.getElementById("videoElement2")];

        navigator.mediaDevices.getUserMedia(constraints)
        .then(function(stream) {
            videoElements.forEach(function(videoElement) {
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = function(e) {
                    videoElement.play();
                };
            });
        })
        .catch(function(error) {
            console.error("Camera access denied or error:", error);
        });
    </script>
</body>
</html>
